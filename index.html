<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Ligas La Salle Primaria</title>
    <!-- Cargar las librerías de React y Babel para JSX -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
    <!-- Cargar la librería de Tailwind CSS desde un CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, h5, h6, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        .nav-button {
            @apply flex items-center py-2 px-4 rounded-full text-white font-medium hover:bg-white/20 transition-all duration-300;
        }
        .btn-primary {
             @apply py-2.5 px-5 bg-[#101097] text-white font-semibold rounded-xl shadow-md hover:bg-[#001E61] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#101097] transition-all duration-300;
        }
        .btn-danger {
            @apply py-2.5 px-5 bg-[#CE0E2D] text-white font-semibold rounded-xl shadow-md hover:bg-[#a80b24] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#CE0E2D] transition-all duration-300;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        @keyframes glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.08); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-glow { animation: glow 3s ease-in-out infinite; }
    </style>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.className = savedTheme;
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <div id="root"></div>

    <!-- Cargar los módulos de Firebase (versión compat UMD, compatible con Babel standalone) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        // Exponer las funciones de Firebase en window.firebaseModules usando la API compat (v9 compat)
        window.firebaseModules = {
            initializeApp:            (...a) => firebase.initializeApp(...a),
            getAuth:                  (app) => app.auth(),
            onAuthStateChanged:       (auth, cb) => auth.onAuthStateChanged(cb),
            signInWithEmailAndPassword: (auth, e, p) => auth.signInWithEmailAndPassword(e, p),
            signOut:                  (auth) => auth.signOut(),
            getFirestore:             (app) => app.firestore(),
            doc:                      (dbOrRef, ...path) => {
                // Si el primer argumento es una colección (tiene método .doc), usarlo directamente
                if (dbOrRef && typeof dbOrRef.doc === 'function' && typeof dbOrRef.firestore === 'function') {
                    return dbOrRef.doc(path[0]);
                }
                // Si es la db raíz, construir el path completo
                return dbOrRef.doc(path.join('/'));
            },
            getDoc:                   (ref) => ref.get(),
            addDoc:                   (ref, data) => ref.add(data),
            setDoc:                   (ref, data, opts) => opts ? ref.set(data, opts) : ref.set(data),
            updateDoc:                (ref, data) => ref.update(data),
            deleteDoc:                (ref) => ref.delete(),
            onSnapshot:               (ref, cb) => ref.onSnapshot(cb),
            collection:               (db, ...path) => db.collection(path.join('/')),
            query:                    (ref, ...constraints) => { let q = ref; constraints.forEach(c => { q = c(q); }); return q; },
            where:                    (field, op, val) => (ref) => ref.where(field, op, val),
            getDocs:                  (ref) => ref.get(),
            writeBatch:               (db) => db.batch(),
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, createContext, useContext, useMemo } = React;

        const getSportTerms = (sport) => {
            const isPointsBased = sport === 'Básquetbol' || sport === 'Tocho' || sport === 'Voleibol';
            return {
                forHeader: isPointsBased ? 'PF' : 'GF',
                againstHeader: isPointsBased ? 'PC' : 'GC',
                scorerHeader: isPointsBased ? 'Puntos' : 'Goles',
                scorerSingular: isPointsBased ? 'Anotador' : 'Goleador',
                scorerPlural: isPointsBased ? 'Anotadores' : 'Goleadores',
                addHomeBtn: isPointsBased ? '+ Anotador Local' : '+ Goleador Local',
                addAwayBtn: isPointsBased ? '+ Anotador Visitante' : '+ Goleador Visitante',
                noScorersMsg: isPointsBased ? 'No hay anotadores registrados.' : 'No hay goleadores registrados.',
            };
        };

        const parseLocalDate = (dateStr) => {
            if (!dateStr) return new Date();
            const [year, month, day] = dateStr.split('-').map(Number);
            return new Date(year, month - 1, day);
        };

        const formatLocalDate = (dateObj) => {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const HOLIDAY_CTE_DATES = [
            // 2025-2026
            "2025-09-26", "2025-10-31", "2025-11-28", "2025-12-19", "2025-12-26", "2026-01-02", "2026-01-09",
            "2026-01-30", "2026-02-27", "2026-03-27", "2026-04-03", "2026-04-10", "2026-05-15", "2026-05-29", "2026-06-26",
            // 2026-2027
            "2026-09-25", "2026-10-30", "2026-11-27", "2026-12-18", "2026-12-25", "2027-01-01", "2027-01-08",
            "2027-01-29", "2027-02-26", "2027-03-26", "2027-04-02", "2027-04-09", "2027-05-14", "2027-05-28", "2027-06-25"
        ];

        const isHolidayOrCTE = (dateString) => {
            return HOLIDAY_CTE_DATES.includes(dateString);
        };

        // --- Telegram Notification Function ---
        const TELEGRAM_BOT_TOKEN = '8314025136:AAG3P1AoU1rExMIeTEsE_1YDxc-Vj3r9Tac';
        const TELEGRAM_CHAT_ID = '6740086';
        const APP_LEVEL_NAME = '🏫 PRIMARIA';

        const sendTelegramNotification = async (message, userEmail) => {
            if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) {
                console.warn("Telegram bot token or chat ID not configured.");
                return;
            }
            try {
                const cleanEmail = userEmail || 'Usuario Administrador';
                const cleanMsg = typeof message === 'string' ? message.replace(/\*/g, '') : message;
                const fullMessage = `📌 [TORNEOS ${APP_LEVEL_NAME}]\n🔔 ACCIÓN EN LA APP:\n${cleanMsg}\n\n👤 Realizada por: ${cleanEmail}`;
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: fullMessage,
                    }),
                });

                const data = await response.json();
                if (data.ok) {
                    console.log("Notificación de Telegram enviada con éxito.");
                } else {
                    console.error("Telegram API error:", data.description);
                }
            } catch (error) {
                console.error("Error de red enviando notificación a Telegram:", error);
            }
        };


        // --- Context and Provider for Data ---
        const DataContext = createContext();

        const DataProvider = ({ children, user, appId, isAuthReady }) => {
            const [tournaments, setTournaments] = useState([]);
            const [selectedTournamentId, setSelectedTournamentId] = useState('');
            const [leagues, setLeagues] = useState([]);
            const [teams, setTeams] = useState([]);
            const [players, setPlayers] = useState([]);
            const [matches, setMatches] = useState([]);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                if (!isAuthReady || !appId) {
                    setIsLoading(true);
                    return;
                }

                // ESTO ES LO CORRECTO (Usa 'firebaseModules' que es donde guardaste todo arriba)
                const db = window.firebaseApp.db;
                const publicDataPath = `artifacts/${appId}/public/data`;
                const collections = ['tournaments', 'leagues', 'teams', 'players', 'matches'];
                const setFunctions = { 
                    tournaments: setTournaments, 
                    leagues: setLeagues, 
                    teams: setTeams, 
                    players: setPlayers, 
                    matches: setMatches 
                };

                const unsubscribers = collections.map(col => {
                    return window.firebaseModules.onSnapshot(window.firebaseModules.collection(db, `${publicDataPath}/${col}`), (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        if (col === 'tournaments') {
                            data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                            setFunctions.tournaments(data);
                            if (data.length > 0 && (!selectedTournamentId || !data.some(t => t.id === selectedTournamentId))) {
                                setSelectedTournamentId(data[0].id);
                            }
                        } else {
                            setFunctions[col](data);
                        }
                    });
                });

                setIsLoading(false);

                return () => unsubscribers.forEach(unsub => unsub());
            }, [appId, isAuthReady, selectedTournamentId]);

            const getMatchBadge = (matchDate, stage) => {
                if (stage === 'semifinal') {
                    return <span className="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-orange-100 dark:bg-orange-900/60 text-orange-800 dark:text-orange-300 border border-orange-300 dark:border-orange-700 shadow-sm">🔥 Semifinal</span>;
                }
                if (stage === 'third_place') {
                    return <span className="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-700 shadow-sm">🥉 3er Lugar</span>;
                }
                if (stage === 'final') {
                    return <span className="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-purple-100 dark:bg-purple-900/60 text-purple-800 dark:text-purple-300 border border-purple-300 dark:border-purple-700 shadow-sm">👑 Gran Final</span>;
                }

                const activeTournament = tournaments.find(t => t.id === selectedTournamentId);
                if (!activeTournament?.inaugurationDate || matchDate < activeTournament.inaugurationDate) {
                    return <span className="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-700 shadow-sm">🤝 Amistoso</span>;
                }
                if (matchDate === activeTournament.inaugurationDate) {
                    return <span className="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-purple-100 dark:bg-purple-900/60 text-purple-800 dark:text-purple-300 border border-purple-300 dark:border-purple-700 shadow-sm">🎉 Inauguración Oficial</span>;
                }
                return <span className="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700 shadow-sm">🏆 Oficial</span>;
            };

            const value = {
                tournaments, selectedTournamentId, setSelectedTournamentId,
                leagues, teams, players, matches,
                isLoading, setIsLoading,
                appId, user, getMatchBadge
            };

            return <DataContext.Provider value={value}>{children}</DataContext.Provider>;
        };

        const useData = () => useContext(DataContext);

        

        // --- Icon Components ---
        const PlusIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clipRule="evenodd" /></svg>
        );
        const CalendarIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clipRule="evenodd" /></svg>
        );
        const TrophyIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M11 6V5a1 1 0 011-1h2a1 1 0 110 2h-1v5a1 1 0 01-1 1h-2a1 1 0 01-1-1V7a1 1 0 011-1zM5 8V7a1 1 0 011-1h2a1 1 0 110 2H6v3a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1h1zM10 2a8 8 0 100 16 8 8 0 000-16zM6 10a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1z" /></svg>
        );
        const EditIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fillRule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clipRule="evenodd" /></svg>
        );
        const TrashIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
        );
        const ChevronDownIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
        );
        const ChevronUpIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clipRule="evenodd" /></svg>
        );
        const LockIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2h2a2 2 0 012 2v6a2 2 0 01-2 2H3a2 2 0 01-2-2v-6a2 2 0 012-2h2zm8-2v2H7V7a3 3 0 016 0z" clipRule="evenodd" /></svg>
        );
        const SunIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        );
        const MoonIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
        );

        const SportIcon = ({ sport }) => {
            const icons = { 'Fútbol': '⚽️', 'Básquetbol': '🏀', 'Tocho': '🏈', 'Voleibol': '🏐' };
            return <span className="mr-2 text-2xl">{icons[sport] || ''}</span>;
        };

        const Modal = ({ show, message, onClose }) => {
            if (!show) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm">
                    <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center border-t-4 border-[#101097]">
                        <p className="text-gray-800 dark:text-white text-lg mb-6">{message}</p>
                        <button onClick={onClose} className="btn-primary w-full">Aceptar</button>
                    </div>
                </div>
            );
        };

        const StandingsTable = ({ standings, sport, onViewTeamDetails }) => {
            if (standings.length === 0) {
                return <p className="text-center text-gray-500 dark:text-gray-400 py-4">No hay datos de clasificación para esta liga.</p>;
            }
            const terms = getSportTerms(sport);
            const headers = ['Pos', 'Equipo', 'PJ', 'G', 'E', 'P', terms.forHeader, terms.againstHeader, 'DG', 'Pts'];
            
            const getPodiumStyles = (index) => {
                if (index === 0) return "bg-gradient-to-r from-amber-500/10 via-amber-400/5 to-transparent border-l-4 border-amber-400 font-bold dark:from-amber-500/20 hover:translate-x-1 transition-all duration-200";
                if (index === 1) return "bg-gradient-to-r from-slate-400/10 via-slate-300/5 to-transparent border-l-4 border-slate-300 font-bold dark:from-slate-400/20 hover:translate-x-1 transition-all duration-200";
                if (index === 2) return "bg-gradient-to-r from-amber-800/10 via-amber-700/5 to-transparent border-l-4 border-amber-700 font-bold dark:from-amber-800/20 hover:translate-x-1 transition-all duration-200";
                return "hover:bg-gray-50 dark:hover:bg-gray-700/50 hover:translate-x-1 transition-all duration-200";
            };

            const getPodiumBadge = (index) => {
                if (index === 0) return <span className="mr-1 text-base">🥇</span>;
                if (index === 1) return <span className="mr-1 text-base">🥈</span>;
                if (index === 2) return <span className="mr-1 text-base">🥉</span>;
                return <span className="text-xs text-gray-400 font-mono w-4 inline-block">{index + 1}</span>;
            };

            return (
                <div className="overflow-x-auto rounded-xl shadow-lg bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700/50">
                    <table className="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead className="bg-gray-50 dark:bg-gray-700/50">
                            <tr>
                                {
                                    headers.map((header, idx) => (
                                        <th key={header} className={`px-4 py-3 text-xs font-bold text-gray-600 dark:text-gray-200 uppercase tracking-wider ${idx <= 1 ? 'text-left' : 'text-center'}`}>{header}</th>
                                    ))
                                }
                            </tr>
                        </thead>
                        <tbody className="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                            {standings.map((team, index) => (
                                <tr key={index} className={getPodiumStyles(index)}>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center font-bold">{getPodiumBadge(index)}</td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">
                                        <div className="flex items-center cursor-pointer" onClick={() => onViewTeamDetails(team.id)}>
                                            <img src={team.logoUrl} alt={`Logo de ${team.teamName}`} referrerPolicy="no-referrer" className="w-6 h-6 rounded-full mr-3 shadow-sm object-contain bg-white border border-gray-100" onError={(e) => { e.target.onerror = null; e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(team.teamName || 'EQ')}&background=101097&color=fff&rounded=true`; }} />
                                            <span className="hover:underline">{team.teamName}</span>
                                        </div>
                                    </td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center text-gray-600 dark:text-gray-300">{team.played}</td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center text-gray-600 dark:text-gray-300">{team.wins}</td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center text-gray-600 dark:text-gray-300">{team.draws}</td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center text-gray-600 dark:text-gray-300">{team.losses}</td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center text-gray-600 dark:text-gray-300">{team.goalsFor}</td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center text-gray-600 dark:text-gray-300">{team.goalsAgainst}</td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center text-gray-600 dark:text-gray-300">{team.goalDifference}</td>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm text-center font-extrabold text-[#101097] dark:text-blue-300 text-base">{team.points}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const TopScorersTable = ({ scorers, sport }) => {
            const terms = getSportTerms(sport);
            if (scorers.length === 0) {
                return <p className="text-center text-gray-500 dark:text-gray-400 py-4">No hay {terms.scorerPlural.toLowerCase()} registrados.</p>;
            }
            return (
                <div className="overflow-x-auto rounded-xl shadow-lg bg-white dark:bg-gray-800">
                    <table className="min-w-full divide-y divide-gray-200 dark:divide-gray-700">

                if (lines.length === 0) {
                    showMessage("Por favor, introduce al menos un jugador.");
                    return;
                }
                
                const players = lines.map(line => {
                    const parts = line.split(',');
                    const name = parts[0]?.trim();
                    const group = parts[1]?.trim().toUpperCase();
                    if (!name || !group) {
                        showMessage(`Línea inválida: "${line}". Asegúrate de usar el formato "Nombre, Grupo".`);
                        return null;

                    return { name, group };

        const InteractiveCalendarWidget = ({ matches, selectedDateFilter, onSelectDate }) => {
            const { tournaments, selectedTournamentId } = useData();
            const activeTournament = tournaments.find(t => t.id === selectedTournamentId);
            const matchDates = matches.map(m => m.date).filter(Boolean).sort();
            const initialDateStr = selectedDateFilter || (matchDates.length > 0 ? matchDates[0] : formatLocalDate(new Date()));
            
            const initialDate = parseLocalDate(initialDateStr);
            const [currentYear, setCurrentYear] = useState(initialDate.getFullYear());
            const [currentMonth, setCurrentMonth] = useState(initialDate.getMonth());

            useEffect(() => {
                if (selectedDateFilter) {
                    const parsed = parseLocalDate(selectedDateFilter);
                    setCurrentYear(parsed.getFullYear());
                    setCurrentMonth(parsed.getMonth());
                }
            }, [selectedDateFilter]);

            const prevMonth = () => {
                if (currentMonth === 0) {
                    setCurrentMonth(11);
                    setCurrentYear(currentYear - 1);
                } else {
                    setCurrentMonth(currentMonth - 1);
                }
            };

            const nextMonth = () => {
                if (currentMonth === 11) {
                    setCurrentMonth(0);
                    setCurrentYear(currentYear + 1);
                } else {
                    setCurrentMonth(currentMonth + 1);
                }
            };

            const monthNames = [
                "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
            ];

            const matchCountsByDate = useMemo(() => {
                const map = {};
                matches.forEach(m => {
                    if (m.date) {
                        map[m.date] = (map[m.date] || 0) + 1;
                    }
                });
                return map;
            }, [matches]);

            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            const daysGrid = [];
            for (let i = 0; i < firstDayOfMonth; i++) {
                daysGrid.push(null);
            }
            for (let day = 1; day <= daysInMonth; day++) {
                daysGrid.push(day);
            }

            return (
                <div className="bg-white dark:bg-gray-800 p-4 sm:p-5 rounded-2xl shadow-md border border-gray-100 dark:border-gray-700 space-y-3">

                        </div>

                                <button
                                    onClick={() => onSelectDate('')}
                                    className="px-2.5 py-1 rounded-lg bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 text-xs font-bold hover:bg-amber-200 transition-all flex items-center shadow-sm"

                                    ✕ Ver Todas ({selectedDateFilter})

                                <button onClick={prevMonth} className="px-2 py-0.5 text-xs font-bold text-gray-700 dark:text-gray-200 hover:bg-white dark:hover:bg-gray-600 rounded transition-all" title="Mes Anterior">←</button>
                                <span className="text-xs font-extrabold px-2 font-outfit min-w-[110px] text-center text-[#101097] dark:text-blue-300">
                                    {monthNames[currentMonth]} {currentYear}
                                </span>

                    <div className="grid grid-cols-7 gap-1">

                            const matchCount = matchCountsByDate[dateString] || 0;
                            const isSelected = selectedDateFilter === dateString;
                            const hasMatches = matchCount > 0;

                            const isFriendly = !activeTournament?.inaugurationDate || dateString < activeTournament.inaugurationDate;
                            const isInauguration = activeTournament?.inaugurationDate && dateString === activeTournament.inaugurationDate;

                            let bgStyle = 'bg-gradient-to-br from-blue-600 to-[#101097] text-white';
                            let badgeStyle = 'bg-white/25 text-white';

                            if (isFriendly) {
                                bgStyle = 'bg-gradient-to-br from-amber-500 to-amber-700 text-white';
                                dateTag = '🤝 ';

                                bgStyle = 'bg-gradient-to-br from-purple-600 to-indigo-800 text-white';
                                dateTag = '🎉 ';
                            }

                            if (isSelected) {
                                bgStyle = 'bg-[#101097] text-white shadow-md ring-2 ring-amber-400 font-black z-10 scale-105';
                                badgeStyle = 'bg-amber-400 text-gray-900';
                            }

                            return (
                                <button

                                    onClick={() => {
                                        if (hasMatches) {

                                    disabled={!hasMatches}
                                    className={`h-10 sm:h-11 rounded-xl flex flex-col items-center justify-center relative transition-all duration-150 p-0.5 ${
                                        hasMatches
                                            ? `${bgStyle} shadow-sm hover:scale-105 hover:shadow font-bold cursor-pointer`
                                            : 'bg-gray-50 dark:bg-gray-700/30 text-gray-400 dark:text-gray-500 cursor-default opacity-50'

                                    title={hasMatches ? `${dateTag}${dateString}: ${matchCount} partido(s)` : ''}
                                >
                                    <span className="text-xs sm:text-sm leading-none flex items-center justify-center">

                                    {hasMatches && (
                                        <span className={`text-[9px] px-1 py-0 rounded-full mt-0.5 font-extrabold leading-tight ${badgeStyle}`}>

                    </div>

                    <div className="flex flex-wrap items-center justify-between text-[11px] text-gray-500 dark:text-gray-400 pt-2 border-t dark:border-gray-700 gap-2">
                        <div className="flex flex-wrap items-center gap-3">
                            <span className="flex items-center gap-1 font-bold text-amber-600 dark:text-amber-400"><span className="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> 🤝 Amistoso</span>
                            <span className="flex items-center gap-1 font-bold text-purple-600 dark:text-purple-400"><span className="w-2.5 h-2.5 rounded-full bg-purple-600 inline-block"></span> 🎉 Inauguración</span>
                            <span className="flex items-center gap-1 font-bold text-[#101097] dark:text-blue-400"><span className="w-2.5 h-2.5 rounded-full bg-[#101097] inline-block"></span> 🏆 Oficial</span>
                        </div>
                    </div>
                </div>

        };

        const MatchesView = ({ matches, getTeamName, appId, db, showMessage, leagues, teams, players, getLeagueName, getPlayersByTeam, selectedDateFilter, selectedLeagueFilter }) => {
            const { getMatchBadge, tournaments, selectedTournamentId } = useData();
            const [selectedMatch, setSelectedMatch] = useState(null);
            const [scoreHome, setScoreHome] = useState(0);
            const [scoreAway, setScoreAway] = useState(0);
            const [penaltyWinnerId, setPenaltyWinnerId] = useState('');
            const [scorers, setScorers] = useState([]);
            const [isEditing, setIsEditing] = useState(false);

            const handleEditMatch = (match) => {
                setSelectedMatch(match);
                setScoreHome(match.scoreHome !== null ? match.scoreHome : 0);
                setScoreAway(match.scoreAway !== null ? match.scoreAway : 0);
                setPenaltyWinnerId(match.penaltyWinnerId || '');
                setScorers(match.scorers || []);
                setIsEditing(true);
            };

            const updatePlayoffFinalists = async (leagueId) => {
                try {
                    const { collection, getDocs, query, where, doc, updateDoc } = window.firebaseModules;
                    const matchesRef = collection(db, `artifacts/${appId}/public/data/matches`);
                    const q = query(matchesRef, where("leagueId", "==", leagueId));
                    const snap = await getDocs(q);
                    const leagueMatches = snap.docs.map(d => d.data());

                    const activeTournamentObj = tournaments.find(t => t.id === selectedTournamentId);
                    const tiebreakerRule = activeTournamentObj?.playoffTiebreakerRule || 'penalties';

                    const sf1 = leagueMatches.find(m => m.playoffKey === 'SF1');
                    const sf2 = leagueMatches.find(m => m.playoffKey === 'SF2');
                    const finalMatch = leagueMatches.find(m => m.playoffKey === 'FINAL');
                    const thirdMatch = leagueMatches.find(m => m.playoffKey === '3RD');

                    if (!finalMatch || !thirdMatch) return;

                    let winnerSF1 = null, loserSF1 = null;
                    let winnerSF2 = null, loserSF2 = null;

                    if (sf1 && sf1.scoreHome !== null && sf1.scoreAway !== null) {
                        if (sf1.scoreHome > sf1.scoreAway) {
                            winnerSF1 = sf1.homeTeamId; loserSF1 = sf1.awayTeamId;
                        } else if (sf1.scoreAway > sf1.scoreHome) {
                            winnerSF1 = sf1.awayTeamId; loserSF1 = sf1.homeTeamId;
                        } else {
                            if (tiebreakerRule === 'penalties' && sf1.penaltyWinnerId) {
                                winnerSF1 = sf1.penaltyWinnerId;
                                loserSF1 = sf1.penaltyWinnerId === sf1.homeTeamId ? sf1.awayTeamId : sf1.homeTeamId;
                            } else {
                                winnerSF1 = (sf1.seedHome || 1) <= (sf1.seedAway || 4) ? sf1.homeTeamId : sf1.awayTeamId;
                                loserSF1 = winnerSF1 === sf1.homeTeamId ? sf1.awayTeamId : sf1.homeTeamId;
                            }
                        }
                    }

                    if (sf2 && sf2.scoreHome !== null && sf2.scoreAway !== null) {
                        if (sf2.scoreHome > sf2.scoreAway) {
                            winnerSF2 = sf2.homeTeamId; loserSF2 = sf2.awayTeamId;
                        } else if (sf2.scoreAway > sf2.scoreHome) {
                            winnerSF2 = sf2.awayTeamId; loserSF2 = sf2.homeTeamId;
                        } else {
                            if (tiebreakerRule === 'penalties' && sf2.penaltyWinnerId) {
                                winnerSF2 = sf2.penaltyWinnerId;
                                loserSF2 = sf2.penaltyWinnerId === sf2.homeTeamId ? sf2.awayTeamId : sf2.homeTeamId;
                            } else {
                                winnerSF2 = (sf2.seedHome || 2) <= (sf2.seedAway || 3) ? sf2.homeTeamId : sf2.awayTeamId;
                                loserSF2 = winnerSF2 === sf2.homeTeamId ? sf2.awayTeamId : sf2.homeTeamId;
                            }
                        }
                    }

                    if (winnerSF1 && winnerSF2) {
                        await updateDoc(doc(db, `artifacts/${appId}/public/data/matches`, finalMatch.id), {
                            homeTeamId: winnerSF1,
                            awayTeamId: winnerSF2
                        });
                    }
                    if (loserSF1 && loserSF2) {
                        await updateDoc(doc(db, `artifacts/${appId}/public/data/matches`, thirdMatch.id), {
                            homeTeamId: loserSF1,
                            awayTeamId: loserSF2
                        });
                    }
                } catch (e) {
                    console.error("Error updating playoff finalists:", e);
                }
            };

            const handleSaveMatch = async () => {
                if (!selectedMatch) return;
                try {
                    const { doc, setDoc } = window.firebaseModules;
                    const parsedScoreHome = parseInt(scoreHome, 10);
                    const parsedScoreAway = parseInt(scoreAway, 10);

                    const matchDataToSave = {
                        ...selectedMatch,
                        scoreHome: parsedScoreHome,
                        scoreAway: parsedScoreAway,
                        scorers,
                        penaltyWinnerId: (parsedScoreHome === parsedScoreAway && penaltyWinnerId) ? penaltyWinnerId : null
                    };

                    await setDoc(doc(db, `artifacts/${appId}/public/data/matches`, selectedMatch.id), matchDataToSave);
                    setIsEditing(false);
                    setSelectedMatch(null);

                    if (selectedMatch.stage) {
                        await updatePlayoffFinalists(selectedMatch.leagueId);
                    }

                    showMessage("Partido actualizado con éxito.");

                    // --- Create detailed Telegram message ---
                    const homeTeamName = getTeamName(selectedMatch.homeTeamId);
                    const awayTeamName = getTeamName(selectedMatch.awayTeamId);

                    let scorersMessage = "\n*Anotadores:*\n";
                    const homeScorers = scorers.filter(s => s.teamId === selectedMatch.homeTeamId);
                    const awayScorers = scorers.filter(s => s.teamId === selectedMatch.awayTeamId);

                    if (homeScorers.length > 0) {
                        scorersMessage += `*${homeTeamName}:*\n`;
                        homeScorers.forEach(s => {
                            scorersMessage += `- ${getPlayerName(s.playerId)} (${s.count})\n`;
                        });
                    }

                    if (awayScorers.length > 0) {
                        scorersMessage += `*${awayTeamName}:*\n`;
                        awayScorers.forEach(s => {
                            scorersMessage += `- ${getPlayerName(s.playerId)} (${s.count})\n`;
                        });
                    }
                    
                    if (homeScorers.length === 0 && awayScorers.length === 0) {
                        scorersMessage = "\nSin anotadores registrados.";
                    }

                    const notificationMessage = `*Resultado de Partido Registrado*\n\n` +
                        `*Liga:* ${getLeagueName(selectedMatch.leagueId)}\n` + 
                        `*Fecha:* ${selectedMatch.date}\n\n` + 
                        `*Resultado Final:*\n` + 
                        `${homeTeamName} *${scoreHome} - ${scoreAway}* ${awayTeamName}\n` + 
                        `${scorersMessage}`;

                    sendTelegramNotification(notificationMessage, user.email);

                } catch (e) {
                    console.error("Error al guardar el partido:", e);
                    showMessage("Error al guardar el partido.");
                }
            };

            const handleAddScorer = (teamId) => {
                setScorers(prev => [...prev, { playerId: '', teamId, count: 1 }]);
            };

            const handleScorerChange = (index, field, value) => {
                const newScorers = [...scorers];
                newScorers[index][field] = value;
                setScorers(newScorers);
            };

            const handleRemoveScorer = (index) => {
                setScorers(prev => prev.filter((_, i) => i !== index));
            };

            const handleNullifyMatch = async () => {
                if (!selectedMatch) return;
                if (confirm("¿Estás seguro de que quieres anular este partido? Se registrará como un empate 0-0 y se borrarán los goleadores.")) {
                    try {
                        const { doc, setDoc } = window.firebaseModules;
                        await setDoc(doc(db, `artifacts/${appId}/public/data/matches`, selectedMatch.id), {
                            ...selectedMatch,
                            scoreHome: 0,
                            scoreAway: 0,
                            scorers: [],
                            status: 'Anulado'
                        });
                        setIsEditing(false);
                        setSelectedMatch(null);
                        showMessage("Partido anulado con éxito (Empate 0-0).");

                        const notificationMessage = `*Partido Anulado*\n\n` +
                            `*Liga:* ${getLeagueName(selectedMatch.leagueId)}\n` +
                            `*Fecha:* ${selectedMatch.date}\n\n` +
                            `*Partido:*\n` +
                            `${getTeamName(selectedMatch.homeTeamId)} vs ${getTeamName(selectedMatch.awayTeamId)}\n\n` +
                            `El partido ha sido anulado y registrado como un empate 0-0.`;

                        sendTelegramNotification(notificationMessage, user.email);
                    } catch (e) {
                        console.error("Error al anular el partido:", e);
                        showMessage("Error al anular el partido.");
                    }
                }
            };

            const filteredMatches = matches.filter(match => {
                const dateMatch = selectedDateFilter ? match.date === selectedDateFilter : true;
                const leagueMatch = selectedLeagueFilter ? match.leagueId === selectedLeagueFilter : true;
                return dateMatch && leagueMatch;
            });

            const sortedMatches = [...filteredMatches].sort((a, b) => new Date(a.date) - new Date(b.date));

            return (
                <div className="space-y-4">
                    {isEditing && selectedMatch ? (
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg space-y-4 border-t-4 border-[#101097]">
                            <h4 className="text-xl font-bold">Editar Partido</h4>
                            <p className="text-gray-500 dark:text-gray-400">
                                {getLeagueName(selectedMatch.leagueId)}
                                <br />
                                {getTeamName(selectedMatch.homeTeamId)} vs {getTeamName(selectedMatch.awayTeamId)} - {selectedMatch.date}
                            </p>
                            <div className="flex items-center space-x-4">
                                <label className="text-sm font-medium">Marcador Local:</label>
                                <input type="number" min="0" value={scoreHome} onChange={(e) => setScoreHome(Math.max(0, parseInt(e.target.value, 10)))} className="w-20 p-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" />
                                <label className="text-sm font-medium">Marcador Visitante:</label>
                                <input type="number" min="0" value={scoreAway} onChange={(e) => setScoreAway(Math.max(0, parseInt(e.target.value, 10)))} className="w-20 p-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" />
                            </div>
                            <div className="space-y-2">
                                <h5 className="text-lg font-semibold">{getSportTerms(leagues.find(l => l.id === selectedMatch.leagueId)?.sport).scorerPlural}</h5>
                                <div className="flex space-x-2">
                                    <button onClick={() => handleAddScorer(selectedMatch.homeTeamId)} className="btn-primary text-sm py-1 px-3">{getSportTerms(leagues.find(l => l.id === selectedMatch.leagueId)?.sport).addHomeBtn}</button>
                                    <button onClick={() => handleAddScorer(selectedMatch.awayTeamId)} className="btn-primary text-sm py-1 px-3">{getSportTerms(leagues.find(l => l.id === selectedMatch.leagueId)?.sport).addAwayBtn}</button>
                                </div>
                                {scorers.map((scorer, index) => (
                                    <div key={index} className="flex items-center space-x-2 bg-gray-50 dark:bg-gray-700/50 p-2 rounded-lg">
                                        <select value={scorer.playerId} onChange={(e) => handleScorerChange(index, 'playerId', e.target.value)} className="p-2 rounded-lg border dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white flex-1">
                                            <option value="">Selecciona un jugador</option>
                                            {getPlayersByTeam(scorer.teamId).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                        <input type="number" min="1" value={scorer.count} onChange={(e) => handleScorerChange(index, 'count', parseInt(e.target.value, 10))} className="w-16 p-2 rounded-lg border dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                                        <button onClick={() => handleRemoveScorer(index)} className="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50 transition-colors"><TrashIcon /></button>
                                    </div>
                                ))}
                            </div>
                                {selectedMatch.stage && parseInt(scoreHome, 10) === parseInt(scoreAway, 10) && (
                                    <div className="bg-purple-50 dark:bg-purple-900/30 p-3 rounded-xl border border-purple-200 dark:border-purple-800 space-y-1.5 mt-3">
                                        <label className="block text-xs font-bold text-purple-900 dark:text-purple-300 uppercase tracking-wider">
                                            🥅 Definición por Penales (Marcador Empatado):
                                        </label>
                                        <select
                                            value={penaltyWinnerId}
                                            onChange={(e) => setPenaltyWinnerId(e.target.value)}
                                            className="w-full p-2 rounded-lg border border-purple-300 dark:border-purple-700 bg-white dark:bg-gray-700 text-sm font-bold text-gray-900 dark:text-white"
                                        >
                                            <option value="">-- Seleccionar Ganador en Penales --</option>
                                            <option value={selectedMatch.homeTeamId}>Gana {getTeamName(selectedMatch.homeTeamId)} en Penales</option>
                                            <option value={selectedMatch.awayTeamId}>Gana {getTeamName(selectedMatch.awayTeamId)} en Penales</option>
                                        </select>
                                    </div>
                                )}
                                <div className="flex justify-end space-x-2 pt-4 border-t dark:border-gray-700">
                                <button onClick={handleNullifyMatch} className="btn-danger">Anular (0-0)</button>
                                <button onClick={() => setIsEditing(false)} className="py-2 px-5 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white font-semibold rounded-lg shadow-md hover:bg-gray-300 dark:hover:bg-gray-500 transition-all duration-300">Cancelar</button>
                                <button onClick={handleSaveMatch} className="btn-primary">Guardar Cambios</button>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {leagues.length === 0 ? (
                                <p className="text-center text-gray-500 dark:text-gray-400 py-8">No hay partidos para mostrar. Por favor, crea las ligas y genera el calendario.</p>
                            ) : (
                                sortedMatches.map(match => (
                                    <div key={match.id} className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-lg flex items-center justify-between hover:shadow-xl transition-all duration-300">
                                        <div>
                                            <p className="font-semibold text-lg flex items-center text-[#101097] dark:text-blue-300">
                                                <SportIcon sport={leagues.find(l => l.id === match.leagueId)?.sport} />
                                                {getLeagueName(match.leagueId)}
                                            </p>
                                            <p className="text-gray-500 dark:text-gray-400 text-sm flex items-center">
                                                <span>{match.date}</span>
                                                {getMatchBadge && getMatchBadge(match.date, match.stage)}
                                            </p>
                                            <p className="text-gray-900 dark:text-white font-bold text-xl mt-1">
                                                {getTeamName(match.homeTeamId)} vs {getTeamName(match.awayTeamId)}
                                            </p>
                                            {match.status === 'Anulado' && <p className="text-[#CE0E2D] dark:text-red-400 font-bold text-sm mt-1">PARTIDO ANULADO</p>}
                                            {match.scoreHome !== null && <p className="text-gray-700 dark:text-gray-300 font-bold text-lg">Marcador: {match.scoreHome} - {match.scoreAway}</p>}
                                        </div>
                                        <button onClick={() => handleEditMatch(match)} className="text-[#101097] hover:text-[#001E61] dark:text-blue-300 dark:hover:text-blue-200 p-2 rounded-full hover:bg-blue-50 dark:hover:bg-blue-900/50 transition-colors"><EditIcon /></button>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const LeagueCard = ({ league, teams, players, matches = [], appId, db, showMessage, onMatchDayChange, onThemeChange, onApplyThemeTeams, onEditTeam, onAddPlayers, onAddTeam, onDeleteTeam }) => {
            const [isExpanded, setIsExpanded] = useState(false);
            const [isUnlocked, setIsUnlocked] = useState(false);
            const dayOptions = [ { value: 1, label: 'Lunes' }, { value: 2, label: 'Martes' }, { value: 3, label: 'Miércoles' }, { value: 4, label: 'Jueves' }, { value: 5, label: 'Viernes' }, { value: 6, label: 'Sábado' }, { value: 0, label: 'Domingo' } ];
            const themeOptions = Object.keys(PRESET_THEMES);

            const hasSchedule = matches.some(m => m.leagueId === league.id);
            const isLocked = hasSchedule && !isUnlocked;

            const handleDeletePlayer = async (playerId) => {
                if (confirm("¿Estás seguro de que quieres eliminar a este jugador?")) {
                    const { doc, deleteDoc } = window.firebaseModules;
                    try {
                        await deleteDoc(doc(db, `artifacts/${appId}/public/data/players`, playerId));
                        showMessage("Jugador eliminado con éxito.");
                    } catch (e) { console.error("Error al eliminar jugador:", e); showMessage("Error al eliminar jugador."); }
                }
            };

            const handleAdd = () => {
                if (isLocked) {
                    showMessage("🔒 No se pueden añadir equipos mientras la liga tenga un calendario generado. Haz clic en 'Desbloquear' arriba si necesitas realizar cambios.");
                    return;
                }
                if (teams.length >= 6) {
                    showMessage("Una liga no puede tener más de 6 equipos.");
                    return;
                }
                onAddTeam(league.id);
            };

            const handleDelete = (teamId) => {
                if (isLocked) {
                    showMessage("🔒 No se pueden eliminar equipos mientras la liga tenga un calendario generado. Haz clic en 'Desbloquear' arriba si necesitas realizar cambios.");
                    return;
                }
                if (teams.length <= 4) {
                    showMessage("Una liga debe tener al menos 4 equipos.");
                    return;
                }
                onDeleteTeam(teamId);
            };

            const handleApplyThemeClick = () => {
                if (isLocked) {
                    if (confirm("🔒 Esta liga tiene un calendario generado. Modificar los equipos de la temática puede alterar el historial de partidos. ¿Deseas desbloquear la edición y aplicar la temática de todas formas?")) {
                        setIsUnlocked(true);
                        onApplyThemeTeams(league.id, league.theme);
                    }
                    return;
                }
                onApplyThemeTeams(league.id, league.theme);
            };

            const handleEditTeamClick = (team) => {
                if (isLocked) {
                    if (confirm("🔒 La edición de equipos está protegida porque ya existe un calendario generado. ¿Deseas desbloquear la edición para corregir este equipo?")) {
                        setIsUnlocked(true);
                        onEditTeam(team);
                    }
                    return;
                }
                onEditTeam(team);
            };

            const handleThemeSelectChange = (e) => {
                const newTheme = e.target.value;
                if (isLocked) {
                    if (confirm("🔒 Cambiar la temática afectará los nombres de los equipos en un calendario existente. ¿Deseas desbloquear la edición y cambiar la temática?")) {
                        setIsUnlocked(true);
                        onThemeChange(league.id, newTheme);
                    }
                    return;
                }
                onThemeChange(league.id, newTheme);
            };

            return (
                <div className="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-xl shadow-inner transition-all duration-300">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-3">
                            <h4 className="text-xl font-semibold text-gray-900 dark:text-white flex items-center">
                                <SportIcon sport={league.sport} />
                                {league.name}
                            </h4>
                            {hasSchedule && (
                                isLocked ? (
                                    <div className="flex items-center gap-1 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 px-2.5 py-1 rounded-xl text-xs font-bold border border-amber-300 dark:border-amber-700 shadow-sm" title="El calendario de partidos ya fue generado. Los equipos están protegidos.">
                                        <span>🔒 Calendario Generado</span>
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                if (confirm("⚠️ ADVERTENCIA: Esta liga ya tiene un calendario de partidos generado. ¿Estás seguro de que deseas desbloquear la edición de equipos? Modificar nombres o escudos podría alterar el historial de los partidos.")) {
                                                    setIsUnlocked(true);
                                                }
                                            }} 
                                            className="ml-1 text-xs font-black text-amber-900 dark:text-amber-100 underline hover:text-amber-600 transition-colors"
                                        >
                                            Desbloquear 🔓
                                        </button>

            );
        };

        const AppContent = ({ user, handleLogin, handleLogout, email, setEmail, password, setPassword, showMessage, isAuthReady }) => {
            const {
                tournaments, selectedTournamentId, setSelectedTournamentId,
                leagues, teams, players, matches,

            } = useData();

            const [view, setView] = useState('standings');
            const [adminTab, setAdminTab] = useState('tournaments');
            const [selectedDateFilter, setSelectedDateFilter] = useState('');

            const [upcomingMatchesDate, setUpcomingMatchesDate] = useState('');

            const [scheduleStartDate, setScheduleStartDate] = useState('');

            const [editingTeam, setEditingTeam] = useState(null);

            const getTeamName = useCallback((teamId) => teams.find(t => t.id === teamId)?.name || 'Equipo Desconocido', [teams]);
            const getTeamLogo = useCallback((teamId) => teams.find(t => t.id === teamId)?.logoUrl || '', [teams]);
            const getPlayerName = useCallback((playerId) => players.find(p => p.id === playerId)?.name || 'Jugador Desconocido', [players]);
            
            const handleMatchDayChange = async (leagueId, day) => {
                if (!user || !appId) return;

                    await updateDoc(doc(window.firebaseApp.db, `artifacts/${appId}/public/data/leagues`, leagueId), { matchDay: day ? parseInt(day, 10) : null });

            const handleThemeChange = async (leagueId, theme) => {
                if (!user || !appId) return;

                try {
                    await updateDoc(doc(window.firebaseApp.db, `artifacts/${appId}/public/data/leagues`, leagueId), { theme });

                            const preset = presetList[i % presetList.length];
                            await updateDoc(doc(window.firebaseApp.db, `artifacts/${appId}/public/data/teams`, leagueTeams[i].id), {
                                name: preset.name,
                                logoUrl: preset.logoUrl

            const handleApplyThemeTeams = async (leagueId, themeName) => {
                const targetTheme = themeName || 'Liga MX';
                const presetList = PRESET_THEMES[targetTheme];
                if (!presetList) {
                    showMessage("Por favor, selecciona primero una Temática de Equipos en el selector.");
                    return;

                const leagueTeams = teams.filter(t => t.leagueId === leagueId);

                if (!confirm(`¿Deseas aplicar los nombres y escudos oficiales de '${targetTheme}' a los ${leagueTeams.length} equipos de esta liga?`)) return;

                setIsLoading(true);
                const { doc, updateDoc } = window.firebaseModules;
                try {
                    for (let i = 0; i < leagueTeams.length; i++) {
                        const preset = presetList[i % presetList.length];
                        await updateDoc(doc(window.firebaseApp.db, `artifacts/${appId}/public/data/teams`, leagueTeams[i].id), {
                            name: preset.name,
                            logoUrl: preset.logoUrl
                        });
                    }
                    showMessage(`Equipos actualizados exitosamente con la temática '${targetTheme}'.`);
                } catch (e) {
                    console.error("Error applying theme teams:", e);
                    showMessage("Error al aplicar los equipos de la temática.");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleEditTeam = (team) => {
                setEditingTeam(team);

            const handleCloseEditTeam = () => {
                setEditingTeam(null);

            const handleUpdateTeam = async (teamId, name, logoUrl) => {
                if (!user || !appId) return;
                const { doc, updateDoc } = window.firebaseModules;

                    await updateDoc(doc(window.firebaseApp.db, `artifacts/${appId}/public/data/teams`, teamId), { name, logoUrl });
                    showMessage("Equipo actualizado con éxito.");
                    sendTelegramNotification(`Equipo actualizado: ${name} (ID: ${teamId})`, user.email);
                    handleCloseEditTeam();
                } catch (e) {
                    console.error("Error updating team:", e); showMessage("Error al actualizar el equipo.");
                }
            };

            const handleOpenAddPlayersModal = (team) => {
                setAddingPlayersTeam(team);
            };

            const handleAddMultiplePlayers = async (teamId, players) => {
                if (!user || !appId) return;
                const { db } = window.firebaseApp;
                const { doc, setDoc } = window.firebaseModules;
                
                const playerPromises = players.map(player => {
                    const playerId = crypto.randomUUID();
                    return setDoc(doc(db, `artifacts/${appId}/public/data/players`, playerId), { 
                        id: playerId, 
                        name: player.name, 
                        group: player.group, 
                        teamId 
                    });
                });

                try {
                    await Promise.all(playerPromises);
                    showMessage(`${players.length} jugador(es) añadido(s) con éxito.`);
                    sendTelegramNotification(`Jugadores añadidos al equipo ${getTeamName(teamId)}: ${players.map(p => p.name).join(', ')}`, user.email);
                    setAddingPlayersTeam(null); // Close modal on success
                } catch (e) {
                    console.error("Error adding multiple players:", e);
                    showMessage("Error al añadir los jugadores.");
                }
            };

            const handleAddTeam = async (leagueId) => {
                if (!user || !appId) return;
                const { db } = window.firebaseApp;
                const { doc, setDoc } = window.firebaseModules;
                const teamId = crypto.randomUUID();
                const newTeam = {
                    id: teamId,
                    name: `Nuevo Equipo ${teams.filter(t => t.leagueId === leagueId).length + 1}`,
                    leagueId,
                    logoUrl: `https://placehold.co/100x100/A0A0A0/FFF?text=N`
                };
                try {
                    await setDoc(doc(db, `artifacts/${appId}/public/data/teams`, teamId), newTeam);
                    showMessage("Equipo añadido con éxito.");
                    sendTelegramNotification(`Equipo añadido a liga ${getLeagueName(leagueId)}: ${newTeam.name}`, user.email);
                } catch (e) {
                    console.error("Error adding team:", e);
                    showMessage("Error al añadir el equipo.");
                }
            };

            const handleDeleteTeam = async (teamId) => {
                if (!user || !appId) return;
                if (!confirm("¿Estás seguro de que quieres eliminar este equipo? Se borrarán también sus jugadores y partidos asociados.")) return;
                
                const { db } = window.firebaseApp;
                const { collection, query, where, getDocs, doc, deleteDoc, writeBatch } = window.firebaseModules;

                try {
                    const batch = writeBatch(db);

                    // Delete players in the team
                    const playersQuery = query(collection(db, `artifacts/${appId}/public/data/players`), where("teamId", "==", teamId));
                    const playersSnapshot = await getDocs(playersQuery);
                    playersSnapshot.forEach(playerDoc => batch.delete(playerDoc.ref));

                    // Delete matches involving the team
                    const homeMatchesQuery = query(collection(db, `artifacts/${appId}/public/data/matches`), where("homeTeamId", "==", teamId));
                    const awayMatchesQuery = query(collection(db, `artifacts/${appId}/public/data/matches`), where("awayTeamId", "==", teamId));
                    const [homeMatchesSnapshot, awayMatchesSnapshot] = await Promise.all([getDocs(homeMatchesQuery), getDocs(awayMatchesQuery)]);
                    homeMatchesSnapshot.forEach(matchDoc => batch.delete(matchDoc.ref));
                    awayMatchesSnapshot.forEach(matchDoc => batch.delete(matchDoc.ref));

                    // Delete the team itself
                    batch.delete(doc(db, `artifacts/${appId}/public/data/teams`, teamId));

                    await batch.commit();
                    showMessage("Equipo y datos asociados eliminados con éxito.");
                } catch (e) {
                    console.error("Error deleting team:", e);
                    showMessage("Error al eliminar el equipo y sus datos asociados.");
                }
            };

            const handleDeleteTournament = async () => {
                if (!selectedTournamentId) {
                    showMessage("Por favor, selecciona un torneo para eliminar.");
                    return;
                }

                if (confirm(`¿Estás seguro de que quieres eliminar el torneo '${tournaments.find(t => t.id === selectedTournamentId)?.name}' y TODOS sus datos (ligas, equipos, jugadores, partidos)? Esta acción es irreversible.`)) {
                    setIsLoading(true);
                    const { db } = window.firebaseApp;
                    const { collection, query, where, getDocs, doc, deleteDoc } = window.firebaseModules;
                    
                    try {
                        const leaguesQuery = query(collection(db, `artifacts/${appId}/public/data/leagues`), where("tournamentId", "==", selectedTournamentId));
                        const leaguesSnapshot = await getDocs(leaguesQuery);
                        const leagueIds = leaguesSnapshot.docs.map(d => d.id);

                        if (leagueIds.length > 0) {
                            const teamsQuery = query(collection(db, `artifacts/${appId}/public/data/teams`), where("leagueId", "in", leagueIds));
                            const teamsSnapshot = await getDocs(teamsQuery);
                            const teamIds = teamsSnapshot.docs.map(d => d.id);

                            if (teamIds.length > 0) {
                                const playersQuery = query(collection(db, `artifacts/${appId}/public/data/players`), where("teamId", "in", teamIds));
                                const playersSnapshot = await getDocs(playersQuery);
                                await Promise.all(playersSnapshot.docs.map(d => deleteDoc(d.ref)));
                            }
                            await Promise.all(teamsSnapshot.docs.map(d => deleteDoc(d.ref)));

                            const matchesQuery = query(collection(db, `artifacts/${appId}/public/data/matches`), where("leagueId", "in", leagueIds));
                            const matchesSnapshot = await getDocs(matchesQuery);
                            await Promise.all(matchesSnapshot.docs.map(d => deleteDoc(d.ref)));
                        }
                        
                        await Promise.all(leaguesSnapshot.docs.map(d => deleteDoc(d.ref)));

                        await deleteDoc(doc(db, `artifacts/${appId}/public/data/tournaments`, selectedTournamentId));

                        const remainingTournaments = tournaments.filter(t => t.id !== selectedTournamentId);
                        if (remainingTournaments.length > 0) {
                            setSelectedTournamentId(remainingTournaments[0].id);
                        } else {
                            setSelectedTournamentId('');
                        }

                        showMessage("Torneo eliminado con éxito.");
                    } catch (e) {
                        console.error("Error deleting tournament:", e);
                        showMessage("Error al eliminar el torneo.");
                    } finally {
                        setIsLoading(false);
                    }
                }
            };

            const handleUpdateInaugurationDate = async (newInaugurationDate) => {
                if (!user || !appId || !selectedTournamentId) return;
                const { doc, updateDoc, writeBatch } = window.firebaseModules;
                try {
                    const db = window.firebaseApp.db;
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/tournaments`, selectedTournamentId), { inaugurationDate: newInaugurationDate });

                    if (visibleMatches.length > 0) {
                        const batch = writeBatch(db);
                        let updatedCount = 0;

                        if (newInaugurationDate) {
                            const targetObj = parseLocalDate(newInaugurationDate);
                            visibleMatches.forEach(m => {
                                const matchDateObj = parseLocalDate(m.date);
                                const diffMs = Math.abs(matchDateObj.getTime() - targetObj.getTime());
                                const diffDays = diffMs / (1000 * 60 * 60 * 24);
                                if (diffDays <= 4 && m.date !== newInaugurationDate) {
                                    batch.update(doc(db, `artifacts/${appId}/public/data/matches`, m.id), { date: newInaugurationDate });
                                    updatedCount++;
                                }
                            });
                        }

                        if (updatedCount > 0) {
                            await batch.commit();
                        }
                    }

                    showMessage(newInaugurationDate ? `Fecha de inauguración deportiva establecida: ${newInaugurationDate}` : "Fecha de inauguración eliminada.");
                } catch (e) {
                    console.error("Error updating inauguration date:", e);
                    showMessage("Error al guardar la fecha de inauguración.");
                }
            };

            const handleDeleteSchedule = async (visibleLeagueIds) => {
                if (confirm("¿Estás seguro de que quieres borrar TODO el calendario para el torneo actual? Esta acción no se puede deshacer.")) {
                    if (!user || !appId || visibleLeagueIds.length === 0) return;
                    setIsLoading(true);
                    const { db } = window.firebaseApp;
                    const { collection, getDocs, query, where, deleteDoc } = window.firebaseModules;
                    try {
                        const q = query(collection(db, `artifacts/${appId}/public/data/matches`), where("leagueId", "in", visibleLeagueIds));
                        const existingMatches = await getDocs(q);
                        if (existingMatches.docs.length > 0) {
                            await Promise.all(existingMatches.docs.map(matchDoc => deleteDoc(matchDoc.ref)));

                            showMessage("No se encontraron partidos para borrar en el calendario actual.");

                    setIsLoading(false);
                }

            const createLeaguesAndTeams = async () => {
                if (!user || !appId) return;
                const tournamentName = prompt(`Introduce un nombre para el nuevo torneo:`, `Torneo Primaria ${new Date().getFullYear()}-${new Date().getFullYear() + 1}`);
                if (!tournamentName) return;

                setIsLoading(true);
                const { db } = window.firebaseApp;
                const { collection, doc, setDoc } = window.firebaseModules;
                
                const defaultThemes = {
                    "Futbol 1ro y 2do de Primaria": "Liga MX",
                    "Futbol 3ro y 4to de Primaria": "Premier League",
                    "Futbol 5to y 6to de Primaria": "LaLiga Española",
                    "Basquetbol 1ro y 2do de Primaria": "Estados de México",
                    "Basquetbol 3ro y 4to de Primaria": "Equipos NBA",
                    "Basquetbol 5to y 6to de Primaria": "Selecciones (Países)",
                };

                const leaguesData = [
                    { name: "Futbol 1ro y 2do de Primaria", sport: "Fútbol", grades: "1ro y 2do", matchTime: "9:00-10:00" },
                    { name: "Basquetbol 1ro y 2do de Primaria", sport: "Básquetbol", grades: "1ro y 2do", matchTime: "9:00-10:00" },
                    { name: "Futbol 3ro y 4to de Primaria", sport: "Fútbol", grades: "3ro y 4to", matchTime: "8:00-9:00" },
                    { name: "Basquetbol 3ro y 4to de Primaria", sport: "Básquetbol", grades: "3ro y 4to", matchTime: "8:00-9:00" },
                    { name: "Futbol 5to y 6to de Primaria", sport: "Fútbol", grades: "5to y 6to", matchTime: "7:00-8:00" },
                    { name: "Basquetbol 5to y 6to de Primaria", sport: "Básquetbol", grades: "5to y 6to", matchTime: "7:00-8:00" },
                ];

                const tournamentId = crypto.randomUUID();
                const newTournament = { id: tournamentId, name: tournamentName, createdAt: new Date().toISOString() };

                try {
                    await setDoc(doc(db, `artifacts/${appId}/public/data/tournaments`, tournamentId), newTournament);

                    for (const leagueData of leaguesData) {
                        const leagueId = crypto.randomUUID();
                        const theme = defaultThemes[leagueData.name] || "Liga MX";

                            tournamentId,
                            theme,
                            matchDay: 5, // Default to Friday
                            ...leagueData 
                        });
